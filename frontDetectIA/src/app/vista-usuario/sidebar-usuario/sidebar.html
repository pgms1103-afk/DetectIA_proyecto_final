<aside class="barra-lateral" [class.colapsado]="isCollapsed" [class.abierto-movil]="mobileOpen">

  <div class="cabecera-lateral">
    <button class="btn-alternar" (click)="toggleSidebar()" title="Alternar menú">
      <i *ngIf="isCollapsed" class="fa-solid fa-bars"></i>
      <i *ngIf="!isCollapsed" class="fa-solid fa-chevron-left"></i>
    </button>

    <button type="button" class="btn-menu-movil" (click)="toggleMobileMenu()"></button>
  </div>

  <nav class="navegacion-lateral">
    <span class="etiqueta-seccion">Principal</span>
    <a class="item-nav activo">
      <span class="icono-nav"><i class="fa-solid fa-magnifying-glass-chart"></i></span>
      <span class="texto-nav">Detector</span>
      <span class="insignia-nav">Beta</span>
    </a>

    <span class="etiqueta-seccion">Herramientas Detección</span>
    <a class="item-nav" [class.activo]="herramientaActual === 'texto'" (click)="seleccionarHerramienta('texto')">
      <span class="icono-nav"><i class="fa-solid fa-book"></i></span>
      <span class="texto-nav">Texto</span>
    </a>
    <a class="item-nav" [class.activo]="herramientaActual === 'video'" (click)="seleccionarHerramienta('video')">
      <span class="icono-nav"><i class="fa-solid fa-video"></i></span>
      <span class="texto-nav">Video</span>
    </a>
    <a class="item-nav" [class.activo]="herramientaActual === 'imagen'" (click)="seleccionarHerramienta('imagen')">
      <span class="icono-nav"><i class="fa-regular fa-image"></i></span>
      <span class="texto-nav">Imágenes</span>
    </a>
    <a class="item-nav" [class.activo]="herramientaActual === 'audio'" (click)="seleccionarHerramienta('audio')">
      <span class="icono-nav"><i class="fa-regular fa-file-audio"></i></span>
      <span class="texto-nav">Audio</span>
    </a>

    <span class="etiqueta-seccion" *ngIf="!isCollapsed">Búsqueda</span>

    <div class="contenedor-buscador-historial" *ngIf="!isCollapsed">
      <div class="grupo-buscador">
        <i class="fa-solid fa-magnifying-glass icono-buscador"></i>
        <input
          [(ngModel)]="nombreArchivo"
          (input)="buscarPorNombre()"
          type="text"
          placeholder="Buscar archivo..."
          class="input-buscador"
        />
      </div>
    </div>

    <span class="etiqueta-seccion">Historial</span>

    <div class="item-historial"
         *ngFor="let archivo of historialArchivos">

      <span class="texto-nav texto-historial" (click)="verDetalleHistorial(archivo)">
        {{ archivo.nombre }}
      </span>

      <div class="acciones-historial">
        <button (click)="abrirModalEditar(archivo); $event.stopPropagation()" title="Editar nombre">
          <i class="fa-solid fa-pen-to-square"></i>
        </button>
        <button (click)="eliminarArchivo(archivo); $event.stopPropagation()" title="Eliminar">
          <i class="fa-solid fa-trash"></i>
        </button>
      </div>
    </div>

    <div class="item-nav" *ngIf="historialArchivos.length === 0">
      <span class="texto-nav texto-vacio">No hay análisis recientes</span>
    </div>
  </nav>

  <div class="pie-lateral">
    <a class="item-nav btn-cerrar-sesion" (click)="cerrarSesion()" style="cursor: pointer;">
      <span class="icono-nav"><i class="fa-solid fa-arrow-right-from-bracket"></i></span>
      <span class="texto-nav" *ngIf="!isCollapsed">Cerrar Sesión</span>
    </a>
  </div>
</aside>

<!-- Modal editar nombre -->
<div class="modal-overlay" *ngIf="mostrarModalEditar" (click)="cerrarModalEditar()">
  <div class="modal-contenido" (click)="$event.stopPropagation()">
    <h3 class="modal-titulo">Editar nombre</h3>
    <input type="text" [(ngModel)]="nombreEditando" class="input-modal" placeholder="Nuevo nombre">
    <div class="modal-botones">
      <button class="btn-guardar" (click)="guardarNombre()">Guardar</button>
      <button class="btn-cancelar" (click)="cerrarModalEditar()">Cancelar</button>
    </div>
  </div>
</div>
