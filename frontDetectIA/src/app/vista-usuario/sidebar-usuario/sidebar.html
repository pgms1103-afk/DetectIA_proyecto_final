<aside class="barra-lateral" [class.colapsado]="isCollapsed" [class.abierto-movil]="mobileOpen">

  <div class="cabecera-lateral">
    <button class="btn-alternar" (click)="toggleSidebar()" title="Alternar menú">
      <i *ngIf="isCollapsed" class="fa-solid fa-bars"></i>
      <i *ngIf="!isCollapsed" class="fa-solid fa-chevron-left"></i>
    </button>

    <button type="button" class="btn-menu-movil" (click)="toggleMobileMenu()"></button>
  </div>

  <nav class="navegacion-lateral">
    <span class="etiqueta-seccion">Principal</span>
    <a class="item-nav activo">
      <span class="icono-nav"><i class="fa-solid fa-magnifying-glass-chart"></i></span>
      <span class="texto-nav">Detector</span>
      <span class="insignia-nav">Beta</span>
    </a>

    <span class="etiqueta-seccion">Herramientas Detección</span>
    <a class="item-nav" [class.activo]="herramientaActual === 'texto'" (click)="seleccionarHerramienta('texto')">
      <span class="icono-nav"><i class="fa-solid fa-book"></i></span>
      <span class="texto-nav">Texto</span>
    </a>
    <a class="item-nav" [class.activo]="herramientaActual === 'video'" (click)="seleccionarHerramienta('video')">
      <span class="icono-nav"><i class="fa-solid fa-video"></i></span>
      <span class="texto-nav">Video</span>
    </a>
    <a class="item-nav" [class.activo]="herramientaActual === 'imagen'" (click)="seleccionarHerramienta('imagen')">
      <span class="icono-nav"><i class="fa-regular fa-image"></i></span>
      <span class="texto-nav">Imágenes</span>
    </a>
    <a class="item-nav" [class.activo]="herramientaActual === 'audio'" (click)="seleccionarHerramienta('audio')">
      <span class="icono-nav"><i class="fa-regular fa-file-audio"></i></span>
      <span class="texto-nav">Audio</span>
    </a>

    <span class="etiqueta-seccion">Historial</span>

    <a class="item-nav"
       *ngFor="let archivo of historialArchivos"
       (click)="verDetalleHistorial(archivo)"
       style="cursor: pointer;">
      <span class="texto-nav">{{ archivo.nombre }}</span>
    </a>

    <a class="item-nav" *ngIf="historialArchivos.length === 0">
      <span class="texto-nav" style="opacity: 0.5; font-size: 0.85em;">No hay análisis recientes</span>
    </a>
  </nav>

  <div class="pie-lateral">
    <div class="perfil-contenedor" (click)="toggleProfileMenu()">
      <div class="avatar-usuario">JM</div>
      <div class="info-usuario">
        <span class="nombre-usuario">{{ user.name }}</span>
      </div>
      <i class="fa-solid fa-chevron-up flecha-menu" [class.rotado]="!showProfileMenu"></i>
    </div>

    <div class="menu-desplegable" *ngIf="showProfileMenu">
      <div class="cabecera-menu">
        <span>Datos del Usuario</span>
      </div>
      <div class="datos-usuario">
        <p><strong>Nombre:</strong> {{ user.name }}</p>
        <p><strong>Correo:</strong> {{ user.email }}</p>
        <div class="estadisticas-menu">
          <span><i class="fa-solid fa-clock"></i> {{ user.time }}</span>
          <span><i class="fa-solid fa-file"></i> {{ user.files }} archivos</span>
        </div>
      </div>
    </div>
  </div>
</aside>
