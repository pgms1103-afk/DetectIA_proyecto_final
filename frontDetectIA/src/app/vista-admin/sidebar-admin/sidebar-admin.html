<aside class="barra-lateral" [class.colapsado]="isCollapsed" [class.abierto-movil]="mobileOpen">
  <div class="cabecera-lateral animate__animated animate__fadeInDown">
    <button class="btn-alternar" (click)="toggleSidebar()">
      <i class="fa-solid fa-chevron-left"></i>
    </button>
    <button class="btn-cerrar-movil" (click)="toggleMobileMenu()">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>

  <nav class="navegacion-lateral">
    <span class="etiqueta-seccion animate__animated animate__fadeIn animate__delay-1s">SISTEMA</span>

    <a class="item-nav animate__animated animate__fadeInLeft" style="animation-delay: 0.1s; cursor: pointer;" (click)="seleccionar('dashboard')">
      <span class="icono-nav"><i class="fa-solid fa-chart-line"></i></span>
      <span class="texto-nav">Panel de Control</span>
    </a>

    <a class="item-nav animate__animated animate__fadeInLeft" style="animation-delay: 0.2s; cursor: pointer;" (click)="seleccionar('usuarios')">
      <span class="icono-nav"><i class="fa-solid fa-users-gear"></i></span>
      <span class="texto-nav">Gestión Usuarios</span>
    </a>


    <span class="etiqueta-seccion animate__animated animate__fadeIn animate__delay-1s">HERRAMIENTAS</span>
    <a class="item-nav animate__animated animate__fadeInLeft" style="animation-delay: 0.25s; cursor: pointer;" (click)="irAVistaUsuario()">
      <span class="icono-nav"><i class="fa-solid fa-magnifying-glass-chart"></i></span>
      <span class="texto-nav">Subir Análisis</span>
    </a>

    <span class="etiqueta-seccion animate__animated animate__fadeIn animate__delay-1s">AUDITORÍA</span>
    <a class="item-nav animate__animated animate__fadeInLeft" style="animation-delay: 0.3s; cursor: pointer;" (click)="seleccionar('auditoria')">
      <span class="icono-nav"><i class="fa-solid fa-clipboard-list"></i></span>
      <span class="texto-nav">Historial Global</span>
    </a>
  </nav>

  <div class="pie-lateral animate__animated animate__fadeInUp" style="animation-delay: 0.5s;">
    <button class="item-nav btn-cerrar-sesion" (click)="cerrarSesion()" style="background: none; border: none; width: 100%; text-align: left; cursor: pointer; display: flex; align-items: center;">
      <span class="icono-nav"><i class="fa-solid fa-arrow-right-from-bracket"></i></span>
      <span class="texto-nav">Cerrar Sesión</span>
    </button>
  </div>
</aside>
