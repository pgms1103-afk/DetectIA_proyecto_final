<div class="contenedor-dashboard">

  <header class="cabecera-dashboard">
    <div class="saludo">
      <h1>Panel de Control <span class="badge-live">Live</span></h1>
      <p>Bienvenido al núcleo de administración de DetectIA</p>
    </div>
  </header>

  <div class="rejilla-metricas">
    <div *ngFor="let m of metricas" class="tarjeta-metrica" [class]="m.color">
      <div class="icono-box">
        <i class="fa-solid {{ m.icono }}"></i>
      </div>
      <div class="datos">
        <span class="etiqueta">{{ m.titulo }}</span>
        <span class="valor">{{ m.valor }}</span>
      </div>
    </div>
  </div>

  <div class="contenedor-graficas">

    <div class="tarjeta-grafica">
      <h3>Tráfico Global de Análisis</h3>
      <div class="canvas-container">
        <canvas id="traficoChart"></canvas>
      </div>
    </div>

    <div class="tarjeta-grafica">
      <h3>Tipos de archivos</h3>
      <div class="canvas-container">
        <canvas id="storageChart"></canvas>
      </div>
    </div>

  </div>

  <div class="rejilla-inferior-graficas">
    <div class="tarjeta-grafica">
      <h3>Resultados de análisis</h3>
      <div class="canvas-container">
        <canvas id="performanceRadarChart"></canvas>
      </div>
    </div>

    <div class="tarjeta-grafica">
      <h3>Uso de API (Últimas 24 Horas)</h3>
      <div class="canvas-container">
        <canvas id="apiUsageChart"></canvas>
      </div>
    </div>
  </div>

</div>
